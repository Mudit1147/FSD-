<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table{
            width: 80%;
            margin: auto;
            padding: 10px;
            font-size: 25px;
            color: red;
            border: 2px solid rgb(0, 0, 0);

        }
        tr {
            height: 80px;
        }
        tr:nth-child(3n+1){
            background-color: rgb(18, 192, 116);
            color: white;
        }
        tr:nth-child(3n+2){
            background-color: rgb(87, 8, 189);
            color: white;
        }
        tr:nth-child(3n+3){
            background-color: rgb(191, 51, 0);
            color: white;
        }
        td, th{
            padding: 10 px;
        }

    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>S.no</th>
                <th>Title</th>
                <th>Image</th>
                <th>Category</th>
                <th>Price</th>
            </tr>
        </thead>
        <tbody id="data">
                
        </tbody>
    </table>
    <script>
        const ele = document.getElementById("data");
        const url = "https://dummyjson.com/products";
        async function loadProduct(){
            try{
                const res = await fetch(url);
                const data = await res.json();
                console.log("DATA", data.products);
                let row = "";
                data.products.map((i, index)=>{
                    row +=`
                    <tr>
                        <td align="center">${index+1}</td>
                        <td>${i.title}</td>
                        <td><img src="${i.images[0]}" width ="90"></td>
                        <td>${i.category}</td>
                        <td>$${i.price}</td>
                    </tr>
                    `;
                })
                ele.innerHTML = row;
            }
            catch(err) {
                console.error("Error fetching product data:", err);
            }
        }
        loadProduct();

    </script>
</body>
</html>
