<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const num=[11,22,32,41,5,62,72,81,9];
        const even=num.filter((i)=>i%2==0);
        const square=even.map((i)=>i*i);
        const sum=square.reduce((acc,cur)=>acc+cur);
        console.log("even numbers are: " +even);    
        console.log("squares of even numbers are: " +square);
        console.log("sum of squares of even numbers are: " +sum);

    </script>
    
</body>
</html>
