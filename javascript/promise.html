<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
       function f1(){
            return new Promise((resolve,reject)=>{
                setTimeout(()=>{
                    console.log("f1 is completed");
                    resolve();
                },4000);
            });
       } 

       function f2(){
            return new Promise((resolve,reject)=>{
                setTimeout(()=>{
                    console.log("f2 is completed");
                    resolve();
                },1000);
            });
       }
       f1().then(f2)
        .catch((err)=>{
            console.log("ERROR:",err);
        });
    </script>
</body>
</html>
