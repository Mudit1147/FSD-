<body>
    <script>
        function abes(x,y){
            document.write(x+y+"<br>");
            document.write(x-y+"<br>");

        }
        abes(5,10);
        abes(15,20);
        abes(25,30);

        const abes1 =() => "hello";
        document.write(abes1());
